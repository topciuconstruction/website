    <rect x="-96" y="-72" width="192" height="144" rx="10"/>
    <circle cx="-38" cy="-22" r="18"/>
    <path d="M-96 44 L-24 -16 L26 30 L58 4 L96 40"/>
  </g>

  <text x="600" y="512" text-anchor="middle" fill="#f0c75b" fill-opacity="0.95"
        font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="46" font-weight="700"
        letter-spacing="10">PLACEHOLDER</text>

  <text x="600" y="576" text-anchor="middle" fill="#ffffff" fill-opacity="0.92"
        font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="42" font-weight="600">Εγκαταστάσεις</text>

  <text x="600" y="632" text-anchor="middle" fill="#dce4ee" fill-opacity="0.7"
        font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="27">Αναμονή φωτογραφίας έργου</text>
</svg>
