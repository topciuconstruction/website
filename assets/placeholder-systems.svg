<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Εγκαταστάσεις — placeholder">
  <defs>
    <pattern id="hatch" width="46" height="46" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="46" height="46" fill="none"/>
      <line x1="0" y1="0" x2="0" y2="46" stroke="#d8a83b" stroke-opacity="0.13" stroke-width="10"/>
    </pattern>
  </defs>

  <rect width="1200" height="900" fill="#0e3157"/>
  <rect width="1200" height="900" fill="url(#hatch)"/>

  <rect x="90" y="150" width="1020" height="600" fill="#071d38" fill-opacity="0.55"
        stroke="#d8a83b" stroke-opacity="0.55" stroke-width="4" stroke-dasharray="22 16" rx="10"/>

  <g transform="translate(600 372)" fill="none" stroke="#f0c75b" stroke-opacity="0.85" stroke-width="7"
